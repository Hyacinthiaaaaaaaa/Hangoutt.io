<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>hangout.io</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pinyon+Script&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: dark maroon stage with corner spider webs and a hanging spider; script wordmark top left, sign in / sign up top right; after sign-in a menu of tools led by Group meeting. */
:root{
  --bg:#2a0505; --bg-deep:#1a0303; --surface:#380909; --surface2:#4a1010; --line:#6b1d1d;
  --fg:#fff3e8; --muted:#dcbcab; --gold:#f2b866; --gold-ink:#2a0505; --red:#d11f35; --web:#fff3e8;
  --shadow:0 12px 30px rgba(0,0,0,.45);
  --font-pixel:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --font-script:'Pinyon Script','Snell Roundhand','Brush Script MT',cursive;
  --font-body:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.55 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh; position:relative; overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;position:relative;z-index:1}
.ico{display:inline-flex;flex:none}

/* Corner webs */
.webs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,rgba(209,31,53,.14),transparent 60%)}
.web{position:absolute;width:min(46vw,340px);color:var(--web);opacity:.34}
.web.tl{left:0;top:0}
.web.tr{right:0;top:0;transform:scaleX(-1)}
.web.br{right:0;bottom:0;transform:rotate(180deg)}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:linear-gradient(var(--bg) 70%,transparent)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:72px;padding-block:8px}
.logo{display:inline-flex;align-items:baseline;text-decoration:none;font:400 44px/1 var(--font-script);color:var(--fg);white-space:nowrap;background:none;border:0;padding:0;cursor:pointer}
.logo .h{font-size:1.35em;line-height:.6}
.logo .io{color:var(--gold)}
.auth{margin-left:auto;display:flex;gap:8px;align-items:center}
.who{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 6px 0 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font:700 16px var(--font-pixel)}
.who .nm{font-weight:600;max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:520px){.logo{font-size:36px}.who .nm{display:none}.who{padding:0 4px}}

/* Buttons */
.btn{min-height:46px;padding:0 20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.gold:hover{filter:brightness(1.07)}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn[aria-disabled="true"]{opacity:.5;pointer-events:none}

/* Landing */
.hero{position:relative;padding:56px 0 48px;min-height:min(70vh,560px);display:flex;flex-direction:column;justify-content:center}
.hero-in{display:flex;flex-direction:column;gap:20px;max-width:640px;padding-left:clamp(0px,6vw,64px)}
.eyebrow{font:700 12px/1 var(--font-body);text-transform:uppercase;letter-spacing:.18em;color:var(--gold)}
h1.pix{font:700 clamp(36px,9vw,72px)/1.04 var(--font-pixel);text-transform:uppercase;letter-spacing:.01em}
h1.pix span{color:var(--gold)}
.lede{color:var(--muted);font-size:17px;max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.thread{position:absolute;left:clamp(6px,2vw,24px);top:-8px;color:var(--fg);transform-origin:50% 0;animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.strip{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 40px}
.pill{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}

/* Home */
.greet{padding:20px 0 24px;display:flex;flex-direction:column;gap:6px}
.greet h1{font:700 clamp(30px,7vw,54px)/1.05 var(--font-pixel);text-transform:uppercase}
.greet h1 span{color:var(--gold)}
.sub{color:var(--muted);max-width:56ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;padding-bottom:48px}
.tile{position:relative;display:flex;flex-direction:column;gap:10px;text-align:left;padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0;min-height:170px}
.tile:hover{border-color:var(--gold);background:var(--surface2)}
.tile .ti{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--bg-deep);color:var(--gold)}
.tile h3{font:700 22px/1.1 var(--font-pixel);text-transform:uppercase;overflow-wrap:anywhere}
.tile p{color:var(--muted);font-size:14px}
.tile.big{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.tile.big .ti{background:var(--gold-ink);color:var(--gold)}
.tile.big p{color:#4a1a0a}
.tile.big:hover{filter:brightness(1.06);background:var(--gold)}
@media (min-width:700px){.tile.big{grid-column:span 2}}

/* Screens */
.screen{padding:12px 0 56px;display:flex;flex-direction:column;gap:20px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px 0 6px;border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.back:hover{color:var(--gold)}
.screen h2{font:700 clamp(28px,6vw,44px)/1.05 var(--font-pixel);text-transform:uppercase}
.screen h2 span{color:var(--gold)}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.notice code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg-deep);padding:1px 6px;border-radius:6px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);min-width:0;overflow:hidden}
.card h3{font:700 20px/1.15 var(--font-pixel);text-transform:uppercase;overflow-wrap:anywhere}
.card p{color:var(--muted);font-size:14px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.chip{display:inline-flex;align-self:flex-start;padding:3px 10px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.block{display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.block h3{font:700 20px/1.1 var(--font-pixel);text-transform:uppercase;color:var(--gold)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.form{display:flex;flex-direction:column;gap:14px}
label.fl{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
label.fl small{font-weight:400;color:var(--muted)}
.field{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg-deep);color:var(--fg);font:inherit;font-size:16px}
textarea.field{padding:12px 14px;min-height:140px;resize:vertical;line-height:1.5}
.err{color:#ff9aa6;font-weight:600;min-height:1.2em}
.share{font:500 13px/1.4 ui-monospace,Menlo,monospace;background:var(--bg-deep);padding:10px 12px;border-radius:10px;overflow-wrap:anywhere}

.bggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.thumb{position:relative;display:block;width:100%;aspect-ratio:16/10;border-radius:16px;border:1px solid var(--line);background-size:cover;background-position:center;cursor:pointer;padding:0;overflow:hidden}
.thumb:hover{border-color:var(--gold)}
.thumb .tl{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);color:#fff;font-weight:700;text-align:left}
.thumb .tl small{display:block;font-weight:500;opacity:.85}

/* Timer */
.clock{display:grid;place-items:center;position:relative;width:min(100%,280px);margin:0 auto}
.clock svg{width:100%;height:auto;transform:rotate(-90deg)}
.clock .t{position:absolute;font:700 clamp(44px,12vw,64px)/1 var(--font-pixel);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg button{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg-deep);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.ctrls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* Groups + picker */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.group{padding:14px;border-radius:14px;background:var(--bg-deep);border:1px solid var(--line)}
.group h4{margin:0 0 6px;font:700 16px var(--font-pixel);text-transform:uppercase;color:var(--gold)}
.group ul{margin:0;padding-left:18px}
.pickbox{display:grid;place-items:center;min-height:140px;padding:20px;border-radius:18px;background:var(--bg-deep);border:1px dashed var(--gold);font:700 clamp(28px,8vw,52px)/1.1 var(--font-pixel);text-transform:uppercase;text-align:center;overflow-wrap:anywhere}
.pickbox.done{color:var(--gold);border-style:solid}
.checkrow{display:flex;align-items:center;gap:10px;font-size:14px;min-height:36px}
.checkrow input{width:20px;height:20px;accent-color:var(--gold)}

footer{position:relative;z-index:1;padding:24px 0 36px;color:var(--muted);font-size:13px;text-align:center}

/* Sheet + toast */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,1,1,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-h h2{font:700 24px/1.1 var(--font-pixel);text-transform:uppercase;color:var(--gold)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg-deep);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.sheet img{width:100%;height:auto;border-radius:14px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--gold);color:var(--gold-ink);padding:10px 16px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="webs" id="webs" aria-hidden="true"></div>

<header class="top">
  <div class="wrap">
    <button class="logo" id="logo" type="button" aria-label="hangout.io home"></button>
    <div class="auth" id="auth"></div>
  </div>
</header>

<main class="wrap" id="view"></main>
<footer>hangout.io · Meetings, voice and chat run on Discord.</footer>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
/* Support for older iPad / Safari versions */
if (!Element.prototype.replaceChildren){
  Element.prototype.replaceChildren = function(){
    while (this.firstChild) this.removeChild(this.firstChild);
    for (var i = 0; i < arguments.length; i++){ var a = arguments[i]; this.appendChild(a && a.nodeType ? a : document.createTextNode(String(a))); }
  };
}
if (!Array.prototype.flat){
  Object.defineProperty(Array.prototype, 'flat', { value: function(){ return this.reduce(function(acc, x){ return acc.concat(x); }, []); }, writable: true, configurable: true });
}
if (!String.prototype.padStart){
  String.prototype.padStart = function(n, ch){ var s = String(this); ch = ch === undefined ? ' ' : String(ch); while (s.length < n) s = ch + s; return s; };
}
</script>
<script>
window.addEventListener('error', function(e){
  var v = document.getElementById('view'); if (!v) return;
  var d = document.createElement('div');
  d.style.cssText = 'margin:24px 0;padding:16px;border:1px solid #f2b866;border-radius:12px;color:#fff3e8;background:#380909;font:14px/1.5 system-ui,sans-serif';
  d.textContent = 'hangout.io could not start. Message: ' + (e.message || 'unknown error') + (e.lineno ? ' (line ' + e.lineno + ')' : '') + '. If you edited the Discord link, check that line, or upload the original index.html again.';
  v.appendChild(d);
});
</script>
<script>
(function(){
'use strict';

/* ===== SET THIS UP =====
   Change ONLY the link on the line below. Keep the quote marks and the semicolon.
   Get it in Discord: open your server, tap the server name, tap Invite, copy the link.
   Example:  const MY_DISCORD_LINK = 'https://discord.gg/abc123';
*/
const MY_DISCORD_LINK = 'https://discord.gg/YOUR_INVITE';
/* ======================= */

/* Rooms. Leave this part as it is. Every room opens your server by default. */
const CONFIG = {
  serverInvite:'https://discord.gg/xww2fwQkk'}
rooms:[
    {name:'Study Hall',    topic:'Open room for quiet group study. Cameras optional.', link:'https://discord.gg/yyGkcMJ'}
    {name:'Group Project', topic:'Work on shared assignments and split up tasks.',     link:'https://discord.gg/t7wTQsBbS'}
    {name:'Exam Prep',     topic:'Quiz each other and go over past papers.',           link:'https://discord.gg/PPre7UnG'}
    {name:'Lounge',        topic:'Take a break and talk about anything but homework.', link:'https://discord.gg/szZNYEf8'}
  ]
};

const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v;
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const ls = {
  get(k, d){ try{ const v = localStorage.getItem('hio.'+k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('hio.'+k, JSON.stringify(v)); }catch(e){} }
};
const OK_HOSTS = ['discord.gg','discord.com','www.discord.com'];
function safeLink(u){
  try{ const x = new URL(String(u || '').trim()); return (x.protocol === 'https:' && OK_HOSTS.indexOf(x.hostname) > -1) ? x.href : null; }
  catch(e){ return null; }
}
const isPlaceholder = u => String(u || '').indexOf('YOUR' + '_INVITE') > -1;
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2400); }
async function copyText(text, ok){
  try{ await navigator.clipboard.writeText(text); toast(ok || 'Copied'); }
  catch(e){ toast('Press and hold the text to copy it'); }
}
function ico(inner, size){
  const s = document.createElement('span'); s.className = 'ico';
  s.innerHTML = '<svg viewBox="0 0 24 24" width="'+(size||24)+'" height="'+(size||24)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+inner+'</svg>';
  return s;
}
const I = {
  meet:'<rect x="3" y="6" width="12" height="12" rx="3"/><path d="M15 10.5l6-3.5v10l-6-3.5"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  looks:'<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 3h6"/>',
  groups:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 5a3.5 3.5 0 010 7M18 14a6.5 6.5 0 013.5 6"/>',
  pick:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="15" r="1"/><circle cx="15" cy="9" r="1"/><circle cx="9" cy="15" r="1"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
function rand(n){ const b = new Uint32Array(1); crypto.getRandomValues(b); return b[0] % n; }
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = rand(i+1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function parseNames(t){ const seen = {}, out = []; String(t || '').split(/[\n,]+/).forEach(x => { x = x.trim().slice(0,30); if (x && !seen[x.toLowerCase()]){ seen[x.toLowerCase()] = 1; out.push(x); } }); return out.slice(0, 60); }

/* ---------- web art ---------- */
function webLines(stroke, sw){
  let d = '';
  for (let i=0;i<=6;i++){ const a = i*Math.PI/12; d += 'M0 0L'+(Math.cos(a)*600).toFixed(0)+' '+(Math.sin(a)*600).toFixed(0); }
  const p = (a,r) => (Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1);
  for (let k=1;k<=8;k++){
    const R = k*46;
    for (let i=0;i<6;i++){
      const a0 = i*Math.PI/12, a1 = (i+1)*Math.PI/12, am = (a0+a1)/2;
      d += (i ? '' : 'M'+p(a0,R)) + 'Q'+p(am,R*0.9)+' '+p(a1,R);
    }
  }
  return '<path d="'+d+'" fill="none" stroke="'+stroke+'" stroke-width="'+(sw||1.3)+'"/>';
}
const cornerWeb = () => '<svg viewBox="0 0 380 380" width="100%" aria-hidden="true">'+webLines('currentColor', 1.3)+'</svg>';
$('#webs').innerHTML = ['tl','tr','br'].map(c => '<div class="web '+c+'">'+cornerWeb()+'</div>').join('');
function spiderThread(){
  const s = h('span', {class:'thread', 'aria-hidden':'true'});
  s.innerHTML = '<svg viewBox="0 0 64 260" width="48" height="196" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M32 0V176" stroke-width="1.3"/><ellipse cx="32" cy="204" rx="9" ry="12" fill="currentColor"/><circle cx="32" cy="186" r="6" fill="currentColor"/><path d="M24 196l-14-9-6 7M24 202l-17 2-5 12M24 208l-12 11-1 11M40 196l14-9 6 7M40 202l17 2 5 12M40 208l12 11 1 11"/></svg>';
  return s;
}

/* ---------- profile (this device only) ---------- */
const auth = {
  profile(){ return ls.get('profile', null); },
  signedIn(){ return !!(this.profile() && ls.get('signedIn', false)); },
  signUp(name, group){ ls.set('profile', {name, group}); ls.set('signedIn', true); },
  signIn(){ ls.set('signedIn', true); },
  signOut(){ ls.set('signedIn', false); }
};

/* ---------- sheet ---------- */
function openSheet(title, ...kids){
  $('#sheet').replaceChildren(h('div', {class:'sheet-h'}, h('h2', {text:title}), h('button', {class:'icon-btn', type:'button', 'aria-label':'Close', onclick:closeSheet}, ico(I.x, 20))), ...kids);
  $('#scrim').hidden = false;
  const f = $('#sheet input'); if (f) setTimeout(() => f.focus(), 30);
}
function closeSheet(){ $('#scrim').hidden = true; }
$('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function signUpSheet(){
  const name = h('input', {class:'field', id:'suName', maxlength:'30', placeholder:'Your name', autocomplete:'nickname'});
  const grp = h('input', {class:'field', id:'suGroup', maxlength:'30', placeholder:'e.g. Class 11A', autocomplete:'off'});
  const err = h('p', {class:'err', role:'alert'});
  openSheet('Sign up', h('form', {class:'form', novalidate:true, onsubmit: e => {
    e.preventDefault();
    const n = name.value.trim(); if (!n){ err.textContent = 'Enter your name.'; return; }
    auth.signUp(n, grp.value.trim()); closeSheet(); show('home'); toast('Welcome, ' + n);

/* --- focus timer --- */
function beep(){
  try{
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 660; o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(.2, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .9);
    o.start(); o.stop(a.currentTime + .9);
  }catch(e){}
}
function timer(){
  const MODES = {focus:{label:'Focus', s:25*60}, short:{label:'Short break', s:5*60}, long:{label:'Long break', s:15*60}};
  let mode = 'focus', left = MODES.focus.s, end = 0, tick = null, done = ls.get('pomos', 0);
  const C = 2*Math.PI*90;
  const circ = (stroke) => {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    [['cx','100'],['cy','100'],['r','90'],['fill','none'],['stroke',stroke],['stroke-width','10'],['stroke-linecap','round']].forEach(a => c.setAttribute(a[0], a[1]));
    return c;
  };
  const time = h('span', {class:'t'}), prog = circ('#f2b866'), track = circ('#6b1d1d');
  prog.setAttribute('stroke-dasharray', C.toFixed(1));
  const ring = h('div', {class:'clock'});
  const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); sv.setAttribute('viewBox', '0 0 200 200'); sv.setAttribute('aria-hidden', 'true'); sv.append(track, prog);
  ring.append(sv, time);
  const count = h('p', {class:'sub', style:'text-align:center'});
  const startBtn = h('button', {class:'btn gold', type:'button'}, 'Start');
  const draw = () => {
    const m = Math.floor(left/60), s = left % 60;
    time.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    prog.setAttribute('stroke-dashoffset', (C * (1 - left / MODES[mode].s)).toFixed(1));
    count.textContent = 'Focus sessions finished on this device: ' + done;
    startBtn.textContent = tick ? 'Pause' : (left < MODES[mode].s ? 'Resume' : 'Start');
  };
  const stop = () => { if (tick){ clearInterval(tick); tick = null; } };
  const step = () => {
    left = Math.max(0, Math.round((end - Date.now()) / 1000)); draw();
    if (left <= 0){ stop(); beep(); if (mode === 'focus'){ done++; ls.set('pomos', done); } toast(mode === 'focus' ? 'Focus session done. Take a break.' : 'Break over. Back to it.'); draw(); }
  };
  startBtn.addEventListener('click', () => { if (tick){ stop(); draw(); return; } if (left <= 0) left = MODES[mode].s; end = Date.now() + left*1000; tick = setInterval(step, 250); draw(); });
  const seg = h('div', {class:'seg', role:'group', 'aria-label':'Timer mode'});
  const drawSeg = () => seg.replaceChildren(...Object.keys(MODES).map(k => h('button', {type:'button', 'aria-pressed':String(k === mode), onclick:() => { stop(); mode = k; left = MODES[k].s; drawSeg(); draw(); }}, MODES[k].label)));
  drawSeg(); draw();
  cleanup = stop;
  return screen(['Focus ', h('span', {text:'timer'})],
    h('div', {class:'block'}, seg, ring,
      h('div', {class:'ctrls'}, startBtn, h('button', {class:'btn', type:'button', onclick:() => { stop(); left = MODES[mode].s; draw(); }}, 'Reset')), count));
}

/* --- pick a presenter --- */
function pick(){
  const ta = namesField('pNames'), box = h('div', {class:'pickbox', 'aria-live':'polite', text:'Ready?'});
  const skip = h('input', {type:'checkbox', id:'pSkip', checked:true});
  const err = h('p', {class:'err', role:'alert'});
  let picked = [], timers = [], busy = false;
  const clear = () => { timers.forEach(clearTimeout); timers = []; busy = false; };
  const go = () => {
    if (busy) return;
    const all = parseNames(ta.value); if (all.length < 2){ err.textContent = 'Add at least two names.'; return; }
    err.textContent = '';
    let pool = skip.checked ? all.filter(n => picked.indexOf(n) < 0) : all;
    if (!pool.length){ picked = []; pool = all; toast('Everyone has gone. Starting over.'); }
    const winner = pool[rand(pool.length)];
    busy = true; box.classList.remove('done');
    let i = 0; const total = 18;
    const spin = () => {
      i++;
      if (i >= total){ box.textContent = winner; box.classList.add('done'); if (skip.checked) picked.push(winner); busy = false; return; }
      box.textContent = all[rand(all.length)];
      timers.push(setTimeout(spin, 60 + i*i*0.9));
    };
    spin();
  };
  cleanup = clear;
  return screen(['Pick a ', h('span', {text:'presenter'})],
    h('div', {class:'two'},
      h('div', {class:'block'},
        h('label', {class:'fl', for:'pNames'}, 'Class list', ta),
        h('label', {class:'checkrow', for:'pSkip'}, skip, 'Skip people who already went'),
        err),
      h('div', {class:'block'}, box,
        h('div', {style:'display:flex;gap:10px;flex-wrap:wrap'},
          h('button', {class:'btn gold', type:'button', onclick:go}, 'Pick someone'),
          h('button', {class:'btn', type:'button', onclick:() => { clear(); picked = []; box.classList.remove('done'); box.textContent = 'Ready?'; }}, 'Start over')))));
}

const VIEWS = {landing, home, meet, chat, looks, timer, groups, pick};
drawAuth();
show(auth.signedIn() ? 'home' : 'landing');
})();
</script>
